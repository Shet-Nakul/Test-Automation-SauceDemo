# Application Config
app.url=https://www.saucedemo.com
app.title=Swag Labs

# Browser Config (chrome | firefox | edge)
browser=chrome
headless=true
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Users
valid.username=standard_user
valid.password=secret_sauce
locked.username=locked_out_user
performance.username=performance_glitch_user
problem.username=problem_user
error.username=error_user
visual.username=visual_user

# Screenshot
screenshot.on.failure=true
screenshot.path=reports/screenshots/

# Report
report.path=reports/ExtentReport.html
report.name=SauceDemo Automation Report
